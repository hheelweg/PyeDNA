# =============================================================================
# HADDOCK3 DNA–dye docking configuration
# Generated from config_template/docking_config.cfg
# =============================================================================

run_dir = "{{ run_dir }}"
mode = "{{ mode }}"
ncores = {{ ncores }}

# Keep intermediate PDB/CNS files and skip automatic HTML analysis.
clean = {{ clean }}
postprocess = {{ postprocess }}

# DNA must be first. Each dye is supplied as a separate HADDOCK molecule.
molecules = [
{{ molecule_lines }}
]


# =============================================================================
# Topology generation
# =============================================================================

[topoaa]

# Combined CNS definitions containing every non-standard dye residue.
ligand_top_fname = "{{ topology_file }}"
ligand_param_fname = "{{ parameter_file }}"

# Delete nonpolar hydrogens and disable protein-specific histidine handling.
delenph = {{ delenph }}
autohis = {{ autohis }}


# =============================================================================
# Rigid-body docking
# =============================================================================

[rigidbody]

ligand_top_fname = "{{ topology_file }}"
ligand_param_fname = "{{ parameter_file }}"
unambig_fname = "{{ restraint_file }}"

# Number of output models and internal attempts per model.
sampling = {{ rigidbody_sampling }}
ntrials = {{ rigidbody_ntrials }}

# Always apply every specified bond-geometry restraint.
randremoval = {{ rigidbody_randremoval }}
unambig_scale = {{ rigidbody_unambig_scale }}

# Intermolecular energy treatment during rigid-body minimization.
inter_rigid = {{ rigidbody_inter_rigid }}
elecflag = {{ rigidbody_elecflag }}

# Restraint-dominated scoring with steric and electrostatic contributions.
w_air = {{ rigidbody_w_air }}
w_vdw = {{ rigidbody_w_vdw }}
w_elec = {{ rigidbody_w_elec }}
w_desolv = {{ rigidbody_w_desolv }}
w_bsa = {{ rigidbody_w_bsa }}
w_dist = {{ rigidbody_w_dist }}

# Disable auxiliary ab-initio restraints.
cmrest = {{ rigidbody_cmrest }}
surfrest = {{ rigidbody_surfrest }}
ranair = {{ rigidbody_ranair }}

# Retain intermolecular translation as an active degree of freedom.
rigidtrans = {{ rigidbody_rigidtrans }}


# =============================================================================
# Select models for flexible refinement
# =============================================================================

[seletop]

select = {{ seletop_select }}


# =============================================================================
# Flexible refinement
# =============================================================================

[flexref]

ligand_top_fname = "{{ topology_file }}"
ligand_param_fname = "{{ parameter_file }}"
unambig_fname = "{{ restraint_file }}"

# Never remove attachment restraints.
randremoval = {{ flexref_randremoval }}

# Restraint force constants during the simulated-annealing stages.
unambig_hot = {{ flexref_unambig_hot }}
unambig_cool1 = {{ flexref_unambig_cool1 }}
unambig_cool2 = {{ flexref_unambig_cool2 }}
unambig_cool3 = {{ flexref_unambig_cool3 }}

# Refinement scoring.
w_air = {{ flexref_w_air }}
w_vdw = {{ flexref_w_vdw }}
w_elec = {{ flexref_w_elec }}
w_desolv = {{ flexref_w_desolv }}
w_bsa = {{ flexref_w_bsa }}

# Molecular-dynamics steps in each refinement stage.
mdsteps_rigid = {{ flexref_mdsteps_rigid }}
mdsteps_cool1 = {{ flexref_mdsteps_cool1 }}
mdsteps_cool2 = {{ flexref_mdsteps_cool2 }}
mdsteps_cool3 = {{ flexref_mdsteps_cool3 }}

# One flexible-residue block is inserted for every dye molecule.
{{ flexibility_lines }}

# Maintain DNA backbone/base geometry while permitting local accommodation.
dnarest_on = {{ flexref_dnarest_on }}
tadfactor = {{ flexref_tadfactor }}
temp_cool3_init = {{ flexref_temp_cool3_init }}

# Electrostatic interactions during refinement.
elecflag = {{ flexref_elecflag }}


# =============================================================================
# Final model evaluation
# =============================================================================

[caprieval]

# Include all DNA and dye atoms in the final evaluation.
allatoms = {{ caprieval_allatoms }}