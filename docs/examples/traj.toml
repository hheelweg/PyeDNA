[trajectory]
# MD run directory, selected ranked structures, and frame range to analyze.
run_directory = "md/run_2026_01_01_12_00"
structures = [1, 2]
frame_interval = "all"
frame_stride = 1
optimize_caps = false

# ============================================================
# Each attachment mirrors one dye attachment from structure.toml.
[[attachments]]
dye = "CY3"
residue = 10
cap = "H"

[[attachments]]
dye = "CY5"
residue = 11
cap = "H"
# ============================================================

# ============================================================
# Each group combines one or more attachment residues for analysis.
[[groups]]
name = "donor"
attachments = [10]

[[groups]]
name = "acceptor"
attachments = [11]
# ============================================================

# ============================================================
# Each classical block requests observables for one group.
[[classical]]
group = "donor"
outputs = ["center_of_geometry", "plane_deviation"]
# ============================================================

# ============================================================
# Defaults shared by quantum jobs.
[qm_defaults]
method = "tddft"
basis = "sto-3g"
nstates = 1
outputs = ["excited_state_energies", "oscillator_strengths", "strongest_state"]
verbosity = 0

# Each quantum block requests a calculation for one group.
[[quantum]]
group = "donor"

[[quantum]]
group = "acceptor"
# ============================================================

# ============================================================
# Each quantum interaction block requests a group-to-group coupling.
[[quantum_interactions]]
type = "coupling"
groups = ["donor", "acceptor"]
method = "tdm"
coupling_type = "electronic"
state_pairs = [["strongest", "strongest"], [0, 0]]
# ============================================================

# ============================================================
# Each classical interaction block requests a group-to-group distance.
[[classical_interactions]]
type = "distance"
groups = ["donor", "acceptor"]
method = "center_of_geometry"

[[classical_interactions]]
type = "axis_angle"
groups = ["donor", "acceptor"]

[[classical_interactions]]
type = "orientation_factor"
groups = ["donor", "acceptor"]
method = "center_of_geometry"

[[classical_interactions]]
type = "plane_angle"
groups = ["donor", "acceptor"]
# ============================================================

[analysis]
# Output directory for this analysis run.
output_root = "analysis"

[analysis.units]
# Units used when writing JSONL records.
energy = "eV"
coupling = "eV"
distance = "angstrom"

[quantum_scheduler]
# Use "auto" to select GPU4PySCF when CUDA GPUs are visible, else CPU PySCF.
device = "auto"
parallel = true
