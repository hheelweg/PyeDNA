[system]
# Select ranked finalized structures from create_structure.
name = "dna_CY3_CY5"
structure_directory = "structures"
structures = [1]

[amber]
# Amber/tleap preparation settings applied to each selected structure.
dna_forcefield = "OL15"
dye_forcefield = "gaff2"
water_forcefield = "tip3p"
solvent_padding = 20.0
positive_ion = "Na+"
negative_ion = "Cl-"
neutralize = true

[workflow]
# Prepare Amber inputs, then run the full MD workflow in order.
stages = ["prepare", "minimize", "equilibrate", "production"]

[simulation]
# Shared MD thermodynamic and integration settings.
temperature = 300.0
pressure = 1.0
timestep = 0.002
cutoff = 8.0

[minimization]
# Two minimization substages use these step counts and the CPU pmemd engine by default.
engine = "pmemd"
cutoff = 8.0
ntmin = 1
max_steps = 1000
steepest_descent_steps = 500
[minimization.restraints.stage1]
# Relax solvent/ions while restraining the structure.
target = "structure"
strength = 10.0
[minimization.restraints.stage2]
# Continue minimization with weak restraints on terminal DNA residues.
target = "terminal"
strength = 10.0

[equilibration]
# Heating and NPT equilibration lengths, output intervals, and optional engine/cutoffs.
engine = "auto"
heating_cutoff = 8.0
npt_cutoff = 8.0
heating_steps = 10000
npt_steps = 50000
npt_chunks = 5
npt_cleanup = "previous"
ntpr = 5000
ntwx = 5000
ntwr = 5000
[equilibration.restraints.stage1]
# Heat entire system with weak restraints on terminal DNA residues.
target = "terminal"
strength = 10.0
[equilibration.restraints.stage2]
# Equilibrate entire system with weak restraints on terminal DNA residues.
target = "terminal"
strength = 5.0


[production]
# Production length, output intervals, and optional engine/cutoff.
engine = "auto"
cutoff = 8.0
steps = 1000000
log_interval = 5000
trajectory_interval = 5000
restart_interval = 50000
force_interval = 0
[production.restraints]
# Run entire system with weak restraints on terminal DNA residues.
target = "terminal"
strength = 5.0

[output]
# Timestamped runs are written below this directory.
directory = "md"
cleanup = "standard"
