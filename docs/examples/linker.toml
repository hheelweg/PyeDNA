[component]
type = "linker"
name = "ExampleLinker"
code = "EL"

[structure]
# Syntax example only. Replace with a chemically valid mapped linker.
dye_cap = "[H:1]"
core = "[C:2]([H:3])([H:4])[O:5]"
dna_cap = "[P:6](=[O:7])([O-:8])([O:9][C:10]([H:11])([H:12])[H:13])"

[structure.boundaries.three_prime]
dye = [1, 2]
dna = [5, 6]

[structure.boundaries.five_prime]
dye = [1, 2]
dna = [5, 6]

[parameterization]
charge_method = "resp"
forcefield = "gaff2"

[parameterization.restraints]
forcefield = "OL15"

[output]
directory = "cwd"
cleanup = "scratch"
