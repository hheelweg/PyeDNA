[system]
# Basename for selected structures and Amber outputs.
name = "dna_CY3_CY5"

[dna]
# Generate a simple NAB double helix.
source = "generate"
name = "dna"
sequence = "TGCACTCTCGATTTATGACCGAGCT"
type = "double_helix"

# ============================================================
# Each attachment replaces one DNA residue with dye + two linker residues.
[[attachments]]
dye = "CY3"
linker = "PP"
residue = 10

[[attachments]]
dye = "CY5"
linker = "DE"
residue = 11
# ============================================================

[forcefield]
# Force fields used while assembling DNA/linker/dye components.
dna = "OL15"
attachments = "gaff2"

[docking]
# HADDOCK3 model generation and selection.
engine = "haddock3"
top_models = 5
